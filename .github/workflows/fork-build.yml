name: Fork Build

# Builds runnable Linux x64 and Windows x64 binaries of the fork on GitHub-hosted runners,
# and publishes them as a GitHub Release on every push to main.
# The upstream workflows target Microsoft's self-hosted runner pools, which
# are not available to forks.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  notes-tests:
    name: Notes tests
    if: github.repository != 'microsoft/vscode'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Notes server tests
        working-directory: notes-server
        run: npm test

      - name: Notes extension tests
        working-directory: extensions/nighthawk-notes
        run: npm test

  linux-x64:
    name: Linux x64
    if: github.repository != 'microsoft/vscode'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      VSCODE_ARCH: x64
      npm_config_arch: x64
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install system dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y libxkbfile-dev libsecret-1-dev libkrb5-dev

      - name: Install dependencies
        run: |
          set -e
          for i in {1..3}; do
            npm ci && break
            if [ $i -eq 3 ]; then
              echo "npm ci failed too many times" >&2
              exit 1
            fi
            echo "npm ci failed $i, trying again..."
          done
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      # The copilot extension's postinstall does not always lay out
      # @github/copilot/sdk during the root npm ci; re-run it if missing.
      - name: Ensure Copilot SDK layout
        working-directory: extensions/copilot
        run: |
          if [ ! -f node_modules/@github/copilot/sdk/index.js ]; then
            npx tsx ./script/postinstall.ts
          fi

      - name: Build Linux x64 binary
        run: npm run gulp vscode-linux-x64-min

      - name: Archive binary
        run: tar -czf nighthawk-linux-x64.tar.gz -C .. VSCode-linux-x64

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nighthawk-linux-x64
          path: nighthawk-linux-x64.tar.gz
          retention-days: 14

  windows-x64:
    name: Windows x64
    if: github.repository != 'microsoft/vscode'
    runs-on: windows-2022
    timeout-minutes: 150
    env:
      VSCODE_ARCH: x64
      npm_config_arch: x64
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        shell: pwsh
        run: |
          . build/azure-pipelines/win32/exec.ps1
          $ErrorActionPreference = "Stop"

          # Patch Electron/v8 headers before native modules are built.
          exec { node build/npm/preinstall.ts }

          for ($i = 1; $i -le 3; $i++) {
            try {
              exec { npm ci }
              break
            }
            catch {
              if ($i -eq 3) {
                Write-Error "npm ci failed too many times"
                throw
              }
              Write-Host "npm ci failed $i, trying again..."
            }
          }
        env:
          npm_config_foreground_scripts: "true"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Ensure Copilot SDK layout
        working-directory: extensions/copilot
        shell: bash
        run: |
          if [ ! -f node_modules/@github/copilot/sdk/index.js ]; then
            npx tsx ./script/postinstall.ts
          fi

      # The packaging step calls signtool.exe, which ships with the Windows SDK
      # on the runner but is not on PATH.
      - name: Add signtool to PATH
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found in the Windows SDK" }
          Write-Host "Using $($signtool.FullName)"
          Add-Content $env:GITHUB_PATH $signtool.DirectoryName

      - name: Build Windows x64 binary
        run: npm run gulp vscode-win32-x64-min

      - name: Archive binary
        shell: pwsh
        run: Compress-Archive -Path ..\VSCode-win32-x64 -DestinationPath nighthawk-win32-x64.zip

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nighthawk-win32-x64
          path: nighthawk-win32-x64.zip
          retention-days: 14

      # Some bundled files have paths too long for Windows' built-in unzip when
      # extracted under a typical Downloads folder, so also ship an installer.
      - name: Build Windows x64 user installer
        shell: pwsh
        run: |
          . build/azure-pipelines/win32/exec.ps1
          $ErrorActionPreference = "Stop"
          exec { npm run gulp vscode-win32-x64-inno-updater }
          exec { npm run gulp vscode-win32-x64-user-setup }
          Move-Item .build\win32-x64\user-setup\VSCodeSetup.exe NighthawkUserSetup-x64.exe

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nighthawk-win32-x64-setup
          path: NighthawkUserSetup-x64.exe
          retention-days: 14

  release:
    name: Publish release
    if: github.repository != 'microsoft/vscode' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [linux-x64, windows-x64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          version=$(node -p "require('./package.json').version")
          tag="v${version}-build.${GITHUB_RUN_NUMBER}"
          gh release create "$tag" dist/* \
            --target "$GITHUB_SHA" \
            --title "Nighthawk ${version} (build ${GITHUB_RUN_NUMBER})" \
            --notes "Built from ${GITHUB_SHA}.

          - Windows x64: download NighthawkUserSetup-x64.exe and run it. It is not code-signed yet, so Windows asks you to confirm (More info, then Run anyway).
          - Windows x64 portable: extract nighthawk-win32-x64.zip into a short folder such as C:\\nh (some paths inside are too long for Windows' unzip under Downloads), then run VSCode-win32-x64\\Nighthawk.exe.
          - Linux x64: download nighthawk-linux-x64.tar.gz, extract it and run VSCode-linux-x64/nighthawk."
