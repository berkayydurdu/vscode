name: Fork Build

# Builds a runnable Linux x64 binary of the fork on GitHub-hosted runners.
# The upstream workflows target Microsoft's self-hosted runner pools, which
# are not available to forks.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  notes-tests:
    name: Notes tests
    if: github.repository != 'microsoft/vscode'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Notes server tests
        working-directory: notes-server
        run: npm test

      - name: Notes extension tests
        working-directory: extensions/nighthawk-notes
        run: npm test

  linux-x64:
    name: Linux x64
    if: github.repository != 'microsoft/vscode'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      VSCODE_ARCH: x64
      npm_config_arch: x64
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install system dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y libxkbfile-dev libsecret-1-dev libkrb5-dev

      - name: Install dependencies
        run: |
          set -e
          for i in {1..3}; do
            npm ci && break
            if [ $i -eq 3 ]; then
              echo "npm ci failed too many times" >&2
              exit 1
            fi
            echo "npm ci failed $i, trying again..."
          done
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      # The copilot extension's postinstall does not always lay out
      # @github/copilot/sdk during the root npm ci; re-run it if missing.
      - name: Ensure Copilot SDK layout
        working-directory: extensions/copilot
        run: |
          if [ ! -f node_modules/@github/copilot/sdk/index.js ]; then
            npx tsx ./script/postinstall.ts
          fi

      - name: Build Linux x64 binary
        run: npm run gulp vscode-linux-x64-min

      - name: Archive binary
        run: tar -czf code-oss-linux-x64.tar.gz -C .. VSCode-linux-x64

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: code-oss-linux-x64
          path: code-oss-linux-x64.tar.gz
          retention-days: 14
